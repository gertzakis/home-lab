---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco-release
  namespace: falco
spec:
  interval: 20m
  # DaemonSet rollout across 4 nodes takes ~6m, longer than the 5m default
  timeout: 15m
  chart:
    spec:
      chart: falco
      # pin major version: chart majors carry breaking changes
      version: ">=9.2.0 <10.0.0"
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: falcosecurity-repo
        namespace: falco
      interval: 10m0s

  values:
    tty: true
    falcosidekick:
      enabled: true
      webui:
        enabled: true
        ingress:
          enabled: true
          ingressClassName: "nginx"
          hosts:
            - host: falcosidekick.home.lab
              paths:
                - path: /
